spring:
  application:
    name: APIGATEWAY

  cloud:
    gateway:
      routes:
        # Route requests to PlaylistService
        - id: playlist-service-route
          uri: lb://PLAYLISTSERVICE
          predicates:
            - Path=/playlists/**

        # Route requests to TrackService
        - id: track-service-route
          uri: lb://TRACKSERVICE
          predicates:
            - Path=/tracks/**

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
